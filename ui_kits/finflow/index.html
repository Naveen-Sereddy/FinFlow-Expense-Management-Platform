<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FinFlow — Interactive UI Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="../../foundations/colors_and_type.css?v=100"/>
  <link rel="stylesheet" href="../../foundations/components.css?v=103"/>
  <!-- Additional Google Fonts for wordmark tweaks -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&display=swap"/>
  <!-- Phosphor Icons (regular + bold + fill) -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"/>

  <style>
    html, body, #root { height: 100%; min-height: 100%; }
    body { overflow-x: hidden; overflow-y: hidden; }

    /* Mobile section — frames pre-scaled via MobileThumb so 3 fit one viewport without horizontal scroll */
    .ff-mobile-shelf {
      display: flex; gap: 20px; padding: 32px;
      background: var(--ff-card-2); border-top: 1px solid var(--ff-border);
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
      <rect width="400" height="300" fill="#15181c"/>
      <g transform="translate(140,80)">
        <polygon points="60,0 112,28 60,56 8,28" fill="#fff" stroke="#15181c" stroke-width="4"/>
        <polygon points="8,28 60,56 60,112 8,84" fill="#15181c"/>
        <polygon points="112,28 112,84 60,112 60,56" fill="#385A9C"/>
      </g>
      <text x="200" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="26" fill="#fff">FinFlow</text>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js?v=101"></script>
  <script src="store.js?v=1"></script>
  <script type="text/babel" src="../../brand/BrandMark.jsx?v=101"></script>
  <script type="text/babel" src="charts.jsx?v=101"></script>
  <script type="text/babel" src="layout.jsx?v=103"></script>
  <script type="text/babel" src="screens/dashboards.jsx?v=101"></script>
  <script type="text/babel" src="screens/expenses.jsx?v=103"></script>
  <script type="text/babel" src="screens/approvals.jsx?v=103"></script>
  <script type="text/babel" src="screens/reports_cards_vendors.jsx?v=101"></script>
  <script type="text/babel" src="screens/settings.jsx?v=102"></script>
  <script type="text/babel" src="screens/misc.jsx?v=103"></script>
  <script type="text/babel" src="screens/mobile.jsx?v=102"></script>

  <script type="text/babel">
    const SCREEN_REGISTRY = [
      // Onboarding
      { id:"onb-workspace", group:"Onboarding", label:"Welcome & workspace", chrome:"fullbleed", Comp: () => <WelcomeWorkspace/> },
      { id:"onb-company", group:"Onboarding", label:"Company details", chrome:"fullbleed", Comp: () => <CompanyDetails/> },
      { id:"onb-connect", group:"Onboarding", label:"Connect financial systems", chrome:"fullbleed", Comp: () => <ConnectSystems/> },
      { id:"onb-invite", group:"Onboarding", label:"Invite team", chrome:"fullbleed", Comp: () => <InviteTeam/> },
      { id:"onb-policy", group:"Onboarding", label:"Expense policy", chrome:"fullbleed", Comp: () => <ExpensePolicy/> },
      { id:"onb-success", group:"Onboarding", label:"Success & launch", chrome:"fullbleed", Comp: () => <OnboardingSuccess/> },

      // Dashboards
      { id:"dashboard", group:"Dashboards", label:"Finance Admin overview", role:"finance", Comp: () => <FinanceDashboard/> },
      { id:"dashboard-mgr", group:"Dashboards", label:"Manager dashboard", role:"manager", Comp: () => <ManagerDashboard/> },
      { id:"dashboard-emp", group:"Dashboards", label:"Employee dashboard", role:"employee", Comp: () => <EmployeeDashboard/> },

      // Expenses
      { id:"expenses", group:"Expenses", label:"Expenses — list", Comp: (props) => <ExpenseList {...props}/> },
      { id:"expense-detail", group:"Expenses", label:"Expense detail", Comp: (props) => <ExpenseDetail {...props}/> },
      { id:"new-expense", group:"Expenses", label:"New expense (desktop)", Comp: (props) => <NewExpense {...props}/> },
      { id:"ocr", group:"Expenses", label:"Receipt OCR review", Comp: () => <OcrReview/> },
      { id:"flagged", group:"Expenses", label:"Policy flagged", Comp: (props) => <FlaggedExpense {...props}/> },
      { id:"import", group:"Expenses", label:"Bulk import CSV", Comp: () => <BulkImport/> },

      // Approvals
      { id:"approvals", group:"Approvals", label:"Approvals queue", Comp: (props) => <ApprovalsQueue {...props}/> },
      { id:"approval-detail", group:"Approvals", label:"Approval detail", Comp: (props) => <ApprovalDetail {...props}/> },
      { id:"approval-bulk", group:"Approvals", label:"Bulk approve (queue)", Comp: () => <ApprovalsQueue/> },
      { id:"approval-history", group:"Approvals", label:"Approval history", Comp: () => <ApprovalHistory/> },

      // Reimbursements
      { id:"reimburse", group:"Reimbursements", label:"Payouts list", Comp: (props) => <ReimbursementsList {...props}/> },
      { id:"payout-detail", group:"Reimbursements", label:"Payout detail", Comp: (props) => <PayoutDetail {...props}/> },
      { id:"schedule-payout", group:"Reimbursements", label:"Schedule payout", Comp: () => <SchedulePayout/> },

      // Reports
      { id:"reports", group:"Reports", label:"Reports home", Comp: (props) => <ReportsHome {...props}/> },
      { id:"report-build", group:"Reports", label:"Report builder", Comp: () => <ReportBuilder/> },
      { id:"saved-report", group:"Reports", label:"Saved report", Comp: (props) => <SavedReport {...props}/> },
      { id:"export-report", group:"Reports", label:"Export", Comp: (props) => <ExportReport {...props}/> },

      // Cards
      { id:"cards", group:"Cards", label:"Cards list", Comp: () => <CardsList/> },
      { id:"card-detail", group:"Cards", label:"Card detail", Comp: (props) => <CardDetail {...props}/> },
      { id:"issue-card", group:"Cards", label:"Issue new card", Comp: () => <IssueCard/> },

      // Vendors
      { id:"vendors", group:"Vendors", label:"Vendor directory", Comp: () => <VendorsList/> },
      { id:"vendor-detail", group:"Vendors", label:"Vendor detail", Comp: (props) => <VendorDetail {...props}/> },

      // Settings
      { id:"settings-profile", group:"Settings", label:"Profile", Comp: () => <SettingsWrapper tab="profile"/> },
      { id:"settings-security", group:"Settings", label:"Security & 2FA", Comp: () => <SettingsWrapper tab="security"/> },
      { id:"settings-team", group:"Settings", label:"Team & roles", Comp: () => <SettingsWrapper tab="team"/> },
      { id:"settings-policies", group:"Settings", label:"Policies", Comp: () => <SettingsWrapper tab="policies"/> },
      { id:"settings-integrations", group:"Settings", label:"Integrations", Comp: () => <SettingsWrapper tab="integrations"/> },
      { id:"settings-billing", group:"Settings", label:"Billing", Comp: () => <SettingsWrapper tab="billing"/> },
      { id:"settings-notif", group:"Settings", label:"Notification prefs", Comp: () => <SettingsWrapper tab="notif-prefs"/> },

      // Other
      { id:"audit", group:"Other", label:"Audit log", Comp: () => <AuditLog/> },
      { id:"notif", group:"Other", label:"Notifications center", Comp: () => <NotificationsCenter/> },
      { id:"help", group:"Other", label:"Help / Support", Comp: () => <Help/> },

      // States
      { id:"state-loading", group:"States", label:"Loading dashboard", Comp: () => <LoadingDashboard/> },
      { id:"state-empty", group:"States", label:"Empty expenses", Comp: () => <EmptyExpenses/> },
      { id:"state-error", group:"States", label:"Error", Comp: () => <ErrorState/> },
      { id:"state-success", group:"States", label:"Success — approval", Comp: (props) => <SuccessApproval {...props}/> },
      { id:"state-rejected", group:"States", label:"Rejected — approval", Comp: (props) => <RejectedState {...props}/> },
      { id:"state-confirm", group:"States", label:"Confirmation — payout scheduled", Comp: (props) => <ConfirmReimbursement {...props}/> },

      // Mobile
      { id:"mobile-flow", group:"Mobile", label:"Employee mobile flow (8 screens)", chrome:"mobile", Comp: () => <MobileShelf/> }
    ];

    const SettingsWrapper = ({ tab }) => {
      const [active, setActive] = React.useState(tab);
      const map = {
        profile: <SettingsProfile/>,
        security: <SettingsSecurity/>,
        team: <SettingsTeam/>,
        policies: <SettingsPolicies/>,
        integrations: <SettingsIntegrations/>,
        billing: <SettingsBilling/>,
        "notif-prefs": <SettingsNotifPrefs/>
      };
      return <SettingsShell active={active} setActive={setActive}>{map[active]}</SettingsShell>;
    };

    /* Wraps a fixed 360x760 MobileFrame in a scaled-down box. transform (not zoom) so
       percentage-based absolute-positioned children inside the frame still resolve
       against the real 360x760 box before the visual scale is applied. */
    const MobileThumb = ({ children, scale }) => (
      <div style={{width:360*scale, height:760*scale, overflow:'hidden', flexShrink:0}}>
        <div ref={(element) => {if (element) element.inert = true;}} style={{width:360, height:760, transform:`scale(${scale})`, transformOrigin:'top left'}}>
          {children}
        </div>
      </div>
    );

    const MOBILE_SCREENS = [
      { label: "Sign in",       Comp: () => <MobileSignIn/> },
      { label: "Home",          Comp: () => <MobileHome/> },
      { label: "Snap receipt",  Comp: () => <MobileSnapReceipt/> },
      { label: "New expense",   Comp: () => <MobileNewExpense/> },
      { label: "Submitted",     Comp: () => <MobileSubmitSuccess/> },
      { label: "Status",        Comp: () => <MobileStatusTimeline/> },
      { label: "My expenses",   Comp: () => <MobileExpenses/> },
      { label: "My card",       Comp: () => <MobileCards/> }
    ];
    const MOBILE_PAGES = [[0,1,2],[3,4,5],[6,7]];

    const MobileShelf = () => {
      const [page, setPage] = React.useState(0);
      const scale = 0.72;
      const indices = MOBILE_PAGES[page];
      return (
        <>
          <PageHead eyebrow="Mobile · Employee POV" title="iOS — expense submission flow"
            sub="Read-only employee screen gallery. Open the mobile demo to enter an expense."/>
          <div className="ff-row" style={{justifyContent:'center', alignItems:'center', gap:20, marginTop:8}}>
            <button
              className="ff-btn ff-btn--ghost ff-btn--icon"
              aria-label="Previous screens"
              disabled={page === 0}
              onClick={() => setPage(p => Math.max(0, p - 1))}
              style={{width:44, height:44, borderRadius:999, border:'1px solid var(--ff-border-strong)', flexShrink:0}}>
              <Icon name="caret-left" size={18}/>
            </button>

            <div className="ff-mobile-shelf" style={{borderRadius:'var(--ff-radius-lg)', border:'1px solid var(--ff-border)', justifyContent:'center', overflow:'visible'}}>
              {indices.map(i => (
                <div key={i} style={{display:'flex', flexDirection:'column', alignItems:'center', gap:10}}>
                  <MobileThumb scale={scale}>{MOBILE_SCREENS[i].Comp()}</MobileThumb>
                  <div style={{fontSize:12, color:'var(--ff-fg-muted)', fontWeight:500}}>{i + 1}. {MOBILE_SCREENS[i].label}</div>
                </div>
              ))}
            </div>

            <button
              className="ff-btn ff-btn--ghost ff-btn--icon"
              aria-label="Next screens"
              disabled={page === MOBILE_PAGES.length - 1}
              onClick={() => setPage(p => Math.min(MOBILE_PAGES.length - 1, p + 1))}
              style={{width:44, height:44, borderRadius:999, border:'1px solid var(--ff-border-strong)', flexShrink:0}}>
              <Icon name="caret-right" size={18}/>
            </button>
          </div>

          <div style={{textAlign:'center', marginTop:14, fontSize:12, fontWeight:500, color:'var(--ff-fg-muted)'}}>
            Screens {indices[0] + 1}–{indices[indices.length - 1] + 1} of {MOBILE_SCREENS.length}
          </div>
          <div className="ff-row" style={{justifyContent:'center', gap:8, marginTop:8}}>
            {MOBILE_PAGES.map((_, i) => (
              <button key={i} aria-label={`Go to screens ${i * 3 + 1}–${Math.min(i * 3 + 3, MOBILE_SCREENS.length)}`} onClick={() => setPage(i)}
                style={{width:20, height:8, borderRadius:999, border:0, padding:0, cursor:'pointer',
                  transform: i === page ? 'scaleX(1)' : 'scaleX(0.4)', transformOrigin:'center',
                  background: i === page ? 'var(--ff-primary)' : 'var(--ff-border-strong)', transition:'transform 200ms var(--ff-ease)'}}/>
            ))}
          </div>
        </>
      );
    };

    const DEFAULT_BY_ROLE = { finance: "dashboard", manager: "dashboard-mgr", employee: "dashboard-emp" };

    const useLocalStorage = (k, init) => {
      const [v, setV] = React.useState(() => {
        try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : init; } catch { return init; }
      });
      React.useEffect(() => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, [k, v]);
      return [v, setV];
    };

    const SHARED_ROUTES = ['expenses','expense-detail','new-expense','ocr','flagged','import','reimburse','payout-detail','cards','card-detail','notif','help','state-empty','state-error'];
    const ffCanAccess = (screen, role) => {
      if (role === 'finance') return !['dashboard-mgr','dashboard-emp'].includes(screen);
      if (SHARED_ROUTES.includes(screen)) return true;
      if (role === 'manager') return ['dashboard-mgr','approvals','approval-detail','approval-bulk','approval-history','state-success','state-rejected','reports','saved-report','export-report'].includes(screen);
      return screen === 'dashboard-emp';
    };
    const ScreenDirectory = ({open,onClose,current,onPick,role}) => {
      const [query,setQuery] = React.useState('');
      const dialog = React.useRef(null);
      const search = React.useRef(null);
      const trigger = React.useRef(null);
      React.useEffect(() => {
        if (open) {trigger.current = document.activeElement;dialog.current.showModal();search.current.focus();}
        else if (dialog.current.open) {dialog.current.close();trigger.current?.focus();}
      },[open]);
      const entries = SCREEN_REGISTRY.filter((entry) => ffCanAccess(entry.id,role) && `${entry.group} ${entry.label}`.toLowerCase().includes(query.toLowerCase()));
      const containFocus = (event) => {
        if (event.key !== 'Tab') return;
        const controls = [...dialog.current.querySelectorAll('button:not(:disabled), input:not(:disabled)')];
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {event.preventDefault();last?.focus();}
        else if (!event.shiftKey && document.activeElement === last) {event.preventDefault();first?.focus();}
      };
      return <dialog ref={dialog} className="ff-directory" aria-labelledby="directory-title" onKeyDown={containFocus} onCancel={(event) => {event.preventDefault();onClose();}}>
        <div className="ff-action-row"><h2 id="directory-title">Demo screen directory</h2><button className="ff-btn" onClick={onClose} aria-label="Close screen directory">Close</button></div>
        <p>Only destinations available to the current preview role are shown.</p>
        <label htmlFor="directory-search">Find a screen</label><input ref={search} id="directory-search" className="ff-input" value={query} onChange={(event) => setQuery(event.target.value)}/>
        <div className="ff-directory-results">{entries.map((entry) => <button key={entry.id} className="ff-nav-item" aria-current={entry.id === current ? 'page' : undefined} onClick={() => {onClose();onPick(entry.id);}}>{entry.group} · {entry.label}</button>)}{!entries.length && <p>No matching screens.</p>}</div>
      </dialog>;
    };

    const NAV_ALIASES = {
      "my-expenses": "expenses", "my-reimburse": "reimburse", "my-cards": "cards",
      "team": "settings-team", "policies": "settings-policies",
      "integrations": "settings-integrations", "settings": "settings-profile",
      "budgets": "saved-report"
    };
    const readRoute = () => {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const screen = params.get("screen");
      if (!screen) return null;
      params.delete("screen");
      return { screen: NAV_ALIASES[screen] || screen, params: Object.fromEntries(params.entries()) };
    };
    const routeHash = (route) => {
      const params = new URLSearchParams({ screen: route.screen, ...route.params });
      return `#${params.toString()}`;
    };

    /* ----- App: role scope and history apply to every route, including deep links. ----- */
    const App = () => {
      const [data] = useFinFlow();
      const [theme,setTheme] = useLocalStorage('ff-theme','light');
      const [role,setRole] = useLocalStorage('ff-role','finance');
      const safeRole = FF_DATA.me[role] ? role : 'finance';
      FF_STORE.actions.setRole(safeRole);
      const [savedRoute,setSavedRoute] = useLocalStorage('ff-route',{screen:DEFAULT_BY_ROLE[safeRole],params:{}});
      const [route,setRoute] = React.useState(() => readRoute() || savedRoute);
      const [dirOpen,setDirOpen] = React.useState(false);
      const filterRef = React.useRef({});
      const pageRef = React.useRef(null);
      const screen = route?.screen || DEFAULT_BY_ROLE[safeRole];
      const allowed = ffCanAccess(screen,safeRole);
      const onNavigate = (id,params = {}) => {
        const target = NAV_ALIASES[id] || id;
        const next = {screen:target,params:target === 'expenses' && !Object.keys(params).length ? filterRef.current : params};
        setRoute(next);setSavedRoute(next);
        if (location.hash !== routeHash(next)) history.pushState(null,'',routeHash(next));
      };
      window.ffNavigate = onNavigate;
      window.ffSaveFilters = (params) => {
        filterRef.current = params;
        if (screen === 'expenses') {
          const next = {screen:'expenses',params};
          history.replaceState(null,'',routeHash(next));setSavedRoute(next);
        }
      };
      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme',theme);
      },[theme]);
      React.useEffect(() => {
        if (!location.hash) history.replaceState(null,'',routeHash(route));
        const sync = () => {const next = readRoute();if(next) {setRoute(next);setSavedRoute(next);}};
        const keys = (event) => {if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {event.preventDefault();setDirOpen((open) => !open);}};
        window.addEventListener('popstate',sync);window.addEventListener('hashchange',sync);window.addEventListener('keydown',keys);
        return () => {window.removeEventListener('popstate',sync);window.removeEventListener('hashchange',sync);window.removeEventListener('keydown',keys);};
      },[]);
      React.useEffect(() => {pageRef.current?.focus();},[screen,route.params?.expenseId,route.params?.reimbursementId,route.params?.operationId]);
      const onRole = (nextRole) => {
        FF_STORE.actions.setRole(nextRole);setRole(nextRole);filterRef.current={};onNavigate(DEFAULT_BY_ROLE[nextRole]);
      };
      const entry = SCREEN_REGISTRY.find((entry) => entry.id === screen);
      const Comp = entry?.Comp;
      const illustrative = screen.startsWith('onb-') || screen.startsWith('settings-') || screen === 'help' || screen === 'state-loading' || screen === 'state-error' || screen === 'state-empty';
      const content = !allowed || !Comp ? <><PageHead title="Destination unavailable" sub="Choose a destination available to this demo role."/><button className="ff-btn" onClick={() => onNavigate(DEFAULT_BY_ROLE[safeRole])}>Go to my overview</button></> : <>
        {illustrative ? <><div className="ff-alert ff-alert--info" role="note">Design preview only. Setup, account, support and service operations are not connected.</div><fieldset disabled ref={(element) => {if (element) element.inert = true;}} className="ff-design-preview"><Comp route={route.params || {}}/></fieldset></> : <Comp key={`${screen}:${JSON.stringify(route.params || {})}`} route={route.params || {}}/>}
      </>;
      return <div className="ff-app">
        <div className="ff-demo-banner"><span>Local demo · role preview, no authentication or money movement</span><button className="ff-btn ff-btn--sm" onClick={() => setDirOpen(true)}>Demo screens</button></div>
        <DemoStorageNotice/>
        <TopNav role={safeRole} current={screen} onNavigate={onNavigate} theme={theme} onTheme={() => setTheme(theme === 'light' ? 'dark' : 'light')} onRole={onRole} onSearchClick={() => setDirOpen(true)} onNotif={() => onNavigate('notif')}/>
        <main ref={pageRef} data-screen={screen} tabIndex="-1" className="ff-page ff-scroll" aria-label="FinFlow content">{content}</main>
        <ScreenDirectory open={dirOpen} onClose={() => setDirOpen(false)} current={screen} onPick={onNavigate} role={safeRole}/>
      </div>;
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
